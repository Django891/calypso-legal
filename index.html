<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calypso — Legal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1C1517;
            color: #FFF5F0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #D4697A;
        }
        p {
            color: #B89A8A;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
        }
        a {
            color: #E8B86D;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid #E8B86D;
            border-radius: 8px;
            transition: background 0.2s;
        }
        a:hover {
            background: rgba(232, 184, 109, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calypso</h1>
        <p>Legal Documents</p>
        <div class="links">
            <a href="privacy">Privacy Policy</a>
            <a href="terms">Terms of Service</a>
        </div>
    </div>
</body>
</html>
